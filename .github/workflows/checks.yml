name: Tests and KiCad package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libxkbcommon0
      - name: Install application and development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Test application
        run: python -m pytest -q tests
      - name: Build and validate KiCad installer
        run: python tools/build_package.py
      - name: Exercise the command-line entry point
        run: python -m emi_assistant --demo --analyze --layout-only --output demo-check.json
      - name: Upload tested installer
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: EMI-Assistant-KiCad-installer
          path: dist/EMI-Assistant-*.zip
          if-no-files-found: error
